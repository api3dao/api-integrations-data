name: Merge data sync

on:
  push:
    branches:
      - 'sync/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Open and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" -q .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "No data changes"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
            exit 0
          fi
          pr_url=$(gh pr create -R "$GITHUB_REPOSITORY" -B main -H "$BRANCH" \
            --title 'Sync data from data-feeds' \
            --body "Opened by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).")
          gh pr merge "$pr_url" -R "$GITHUB_REPOSITORY" --merge --delete-branch